<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>來馬戲團看一點大場面</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 等比縮放: 畫面寬 --cw 由 art.js 啟動時決定(電腦 1280、手機 1280~1680), 高 720; 寬 = 視窗寬與「視窗高 × 寬高比」取小, 置中、不裁切、不變形 */
  canvas { display: block; background: #000; width: min(100vw, calc(100vh * var(--cw, 1280) / 720)); height: auto; aspect-ratio: var(--cw, 1280) / 720; }
  @supports (height: 100dvh) { canvas { width: min(100vw, calc(100dvh * var(--cw, 1280) / 720)); } }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="art/art.js"></script>
<script src="audio/sound.js"></script>
<script src="game.js"></script>
<script src="touch.js"></script>
</body>
</html>
